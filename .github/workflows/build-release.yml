name: build release

# Maintainer-only. Manual trigger, and it publishes a GitHub release, so it must
# never fire on a push.
#
# A release is a DRAFT unless the publish input is exactly "true", so an unset or
# mistyped value cannot publish to the public repository.
#
# For every supported target this builds the firmware and publishes two
# artefacts:
#   <NAME>.zip  bootloader.bin, partition-table.bin, <NAME>.bin, FLA.txt
#   <NAME>.bin  one merged image, flashed at offset 0x0
# where <NAME> is ESP32, ESP32S3, ESP32C3 or ESP32P4.
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release tag, e.g. v1.0.0'
        required: true
        type: string
      publish:
        description: 'Publish the release. Leave unset to keep it as a draft.'
        required: false
        default: false
        type: boolean

env:
  IDF_VERSION: v5.5
  IDF_PATH: /home/runner/esp-idf

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: esp32
            name: ESP32
            chip: esp32
            imgtype: ESP32
          - target: esp32s3
            name: ESP32S3
            chip: esp32s3
            imgtype: ESP32-S3
          - target: esp32c3
            name: ESP32C3
            chip: esp32c3
            imgtype: ESP32-C3
          - target: esp32p4
            name: ESP32P4
            chip: esp32p4
            imgtype: ESP32-P4
    steps:
      - uses: actions/checkout@v4

      # There is no official ESP-IDF setup action: espressif/idf does not exist
      # as a repository and espressif/esp-idf ships no action.yml.
      #
      # Installing ESP-IDF emits tens of thousands of lines, so it is captured
      # to a file and only shown if it fails.
      - name: Install ESP-IDF
        run: |
          set -eu
          log="install-${{ matrix.target }}.log"
          # A subshell, not a brace group: an exit inside {} would terminate
          # this step before the failure branch could show the log.
          if (
            git clone -b "$IDF_VERSION" --recursive --depth 1 --quiet \
              https://github.com/espressif/esp-idf.git "$IDF_PATH" &&
            cd "$IDF_PATH" &&
            ./install.sh ${{ matrix.target }}
          ) >"$log" 2>&1; then
            echo "ESP-IDF $IDF_VERSION installed for ${{ matrix.target }} ($(wc -l <"$log") lines hidden)"
          else
            echo "::error::ESP-IDF install failed; last 80 lines:"
            tail -80 "$log"
            exit 1
          fi

      # Build and package happen in one step on purpose. Every run: block is a
      # fresh shell, so idf.py and esptool.py only exist after export.sh has been
      # sourced. Splitting these previously produced "esptool.py: command not
      # found" in the packaging step.
      - name: Build and package
        run: |
          set -eu
          . "$IDF_PATH/export.sh"

          # The target is selected explicitly: ESP-IDF does not read it from
          # sdkconfig.defaults, so relying on that alone builds for the wrong
          # chip.
          idf.py set-target ${{ matrix.target }}
          idf.py build

          name="${{ matrix.name }}"
          chip="${{ matrix.chip }}"

          # Absolute paths on purpose. A previous version zipped into
          # "stage/<NAME>/../<NAME>.zip", which resolves to stage/<NAME>.zip
          # rather than the repository root, so the zip was never uploaded and
          # the release carried only the merged images.
          stage="$PWD/stage/$name"
          outdir="$PWD/out"
          infodir="$PWD/info"
          mkdir -p "$stage" "$outdir" "$infodir"

          cp build/bootloader/bootloader.bin           "$stage/bootloader.bin"
          cp build/partition_table/partition-table.bin "$stage/partition-table.bin"
          cp build/esp32-memtest.bin                   "$stage/$name.bin"

          sed -e "s/@NAME@/$name/g" \
              -e "s/@CHIP@/$chip/g" \
              -e "s/@TARGET@/${{ matrix.target }}/g" \
              packaging/FLA.in.txt > "$stage/FLA.txt"

          # --flash_mode, --flash_freq and --flash_size are deliberately left
          # out. merge_bin then takes them from the bootloader's own header, so
          # the merged image always matches how this target was built. These
          # differ per target: esp32 is 2 MB at 40 MHz, esp32s3 is 16 MB.
          esptool.py --chip "$chip" merge_bin \
            -o "$outdir/$name.bin" \
            0x0     build/bootloader/bootloader.bin \
            0x8000  build/partition_table/partition-table.bin \
            0x10000 build/esp32-memtest.bin

          # Do not ship an image that will not boot.
          esptool.py image_info "$outdir/$name.bin" | tee "$infodir/$name.txt"
          grep -qi "checksum.*valid" "$infodir/$name.txt" || {
            echo "::error::merged image for $name failed checksum validation"
            exit 1
          }
          grep -qi "Detected image type: ${{ matrix.imgtype }}" "$infodir/$name.txt" || {
            echo "::error::merged image for $name is not a ${{ matrix.imgtype }} image"
            grep -i "detected image type" "$infodir/$name.txt" || true
            exit 1
          }

          # Zip from outside the directory being zipped so the archive cannot
          # contain itself.
          ( cd "$stage" && zip -q -r "$outdir/$name.zip" . )

          test -s "$outdir/$name.zip" && test -s "$outdir/$name.bin" || {
            echo "::error::packaging produced nothing for $name"
            exit 1
          }
          echo "built $name.bin ($(stat -c%s "$outdir/$name.bin") bytes) and $name.zip ($(stat -c%s "$outdir/$name.zip") bytes)"

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.name }}
          path: |
            out/${{ matrix.name }}.zip
            out/${{ matrix.name }}.bin

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history and every v* tag, so the notes are compared against
          # the previous release rather than guessed at.
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          path: artefacts

      - name: Collect artefacts
        run: |
          set -eu
          mkdir -p dist
          find artefacts \( -name '*.zip' -o -name '*.bin' \) -print | while read -r f; do
            cp "$f" dist/
          done
          ls -l dist
          # Name every missing file rather than just counting, so a failure says
          # which target went wrong.
          missing=""
          for n in ESP32 ESP32S3 ESP32C3 ESP32P4; do
            [ -s "dist/$n.zip" ] || missing="$missing $n.zip"
            [ -s "dist/$n.bin" ] || missing="$missing $n.bin"
          done
          if [ -n "$missing" ]; then
            echo "::error::missing artefacts:$missing"
            exit 1
          fi
          echo "all 8 artefacts present"

      - name: Build release notes
        env:
          TAG: ${{ inputs.version }}
          REPO: ${{ github.repository }}
        run: |
          set -eu
          chmod +x packaging/release_notes.py
          # Compares against the highest existing v* tag, groups the commits in
          # between by type, and inserts a section into CHANGELOG.md.
          python3 packaging/release_notes.py --version "$TAG" \
            --repo "$REPO" --out notes-changes.md --no-header
          echo "--- changes ---"
          cat notes-changes.md

      - name: Commit the changelog
        env:
          TAG: ${{ inputs.version }}
        run: |
          set -eu
          if git diff --quiet -- CHANGELOG.md; then
            echo "CHANGELOG.md already up to date"
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md
          git commit -m "docs: changelog for $TAG"
          git push origin "HEAD:${{ github.ref_name }}"

      - name: Assemble release body
        env:
          TAG: ${{ inputs.version }}
          REPO: ${{ github.repository }}
        run: |
          set -eu
          # Absolute asset URLs: GitHub serves release downloads from
          # /releases/download/<tag>/<file>, not from the tag page.
          sed -e "s|@TAG@|$TAG|g" -e "s|@REPO@|$REPO|g" \
            packaging/RELEASE_BODY.in.md > notes-head.md
          # Normalise trailing newlines so the headings below never collide with
          # the last line of the section above them.
          for f in notes-head.md notes-changes.md; do
            printf '\n' >> "$f"
          done
          {
            cat notes-head.md
            echo "## Changelog"
            echo
            cat notes-changes.md
          } > notes.md
          echo "--- release body ---"
          cat notes.md

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          # Taken from the environment rather than interpolated with ${{ }}, so
          # the shell sees a plain string and a typo cannot become syntax.
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_PUBLISH: ${{ inputs.publish }}
        run: |
          set -eu

          tag="$INPUT_VERSION"
          case "$tag" in
            v[0-9]*) ;;
            *) echo "::error::the tag must look like v1.0.0, got '$tag'"; exit 1 ;;
          esac

          # Only an explicit "true" publishes. An empty value means the input was
          # never set, so the release stays a draft; anything else is a mistake
          # worth failing on rather than quietly guessing at.
          args="--draft"
          case "$INPUT_PUBLISH" in
            "")    ;;                            # unset: keep it a draft
            true)  args="--draft=false" ;;
            false) ;;                            # explicit draft
            *) echo "::error::publish must be true or false, got '$INPUT_PUBLISH'"; exit 1 ;;
          esac

          gh release create "$tag" dist/*.bin dist/*.zip --title "$tag" \
            --notes-file notes.md $args