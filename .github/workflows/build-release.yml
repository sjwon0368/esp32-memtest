name: build release

# Manual only, and it publishes a GitHub Release, so it must never fire on a
# push. Start it with:
#   gh workflow run build-release.yml -f version=v1.0.0                 (draft)
#   gh workflow run build-release.yml -f version=v1.0.0 -f publish=true (publish)
#
# The -f form is required: `gh workflow run` takes no positional arguments, so
# "gh workflow run build-release.yml v1.0.0" silently does the wrong thing.
#
# The release is a DRAFT unless publish is exactly "true", so a mistyped or empty
# value can never publish to the public repository.
#
# For every supported target this builds the firmware and publishes two
# artefacts:
#   <NAME>.zip  bootloader.bin, partition-table.bin, <NAME>.bin, FLA.txt
#   <NAME>.bin  one merged image, flashed at offset 0x0
# where <NAME> is ESP32, ESP32S3, ESP32C3 or ESP32P4.
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release tag, e.g. v1.0.0'
        required: true
        type: string
      publish:
        description: 'Publish the release. Leave unset to keep it as a draft.'
        required: false
        default: false
        type: boolean

env:
  IDF_VERSION: v5.5
  IDF_PATH: /home/runner/esp-idf

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: esp32
            name: ESP32
            chip: esp32
            imgtype: ESP32
          - target: esp32s3
            name: ESP32S3
            chip: esp32s3
            imgtype: ESP32-S3
          - target: esp32c3
            name: ESP32C3
            chip: esp32c3
            imgtype: ESP32-C3
          - target: esp32p4
            name: ESP32P4
            chip: esp32p4
            imgtype: ESP32-P4
    steps:
      - uses: actions/checkout@v4

      # There is no official ESP-IDF setup action: espressif/idf does not exist
      # as a repository and espressif/esp-idf ships no action.yml.
      #
      # Installing ESP-IDF emits tens of thousands of lines, which makes the log
      # unreadable, so it is captured to a file and only shown if it fails.
      - name: Install ESP-IDF
        run: |
          set -eu
          log="install-${{ matrix.target }}.log"
          # A subshell, not a brace group: an exit inside {} would terminate
          # this step before the failure branch could show the log.
          if (
            git clone -b "$IDF_VERSION" --recursive --depth 1 --quiet \
              https://github.com/espressif/esp-idf.git "$IDF_PATH" &&
            cd "$IDF_PATH" &&
            ./install.sh ${{ matrix.target }}
          ) >"$log" 2>&1; then
            echo "ESP-IDF $IDF_VERSION installed for ${{ matrix.target }} " \
                 "($(wc -l <"$log") lines of installer output hidden)"
          else
            echo "::error::ESP-IDF install failed; last 80 lines:"
            tail -80 "$log"
            exit 1
          fi

      # Build and package happen in one step on purpose. Every run: block is a
      # fresh shell, so idf.py and esptool.py only exist after export.sh has been
      # sourced. Splitting these into separate steps previously produced
      # "esptool.py: command not found" in the packaging step.
      - name: Build and package
        run: |
          set -eu
          . "$IDF_PATH/export.sh"

          # The target is selected explicitly: ESP-IDF does not read it from
          # sdkconfig.defaults, so relying on that alone builds for the wrong
          # chip.
          idf.py set-target ${{ matrix.target }}
          idf.py build

          name="${{ matrix.name }}"
          chip="${{ matrix.chip }}"
          stage="stage/$name"
          mkdir -p "$stage"

          cp build/bootloader/bootloader.bin          "$stage/bootloader.bin"
          cp build/partition_table/partition-table.bin "$stage/partition-table.bin"
          cp build/esp32-memtest.bin                  "$stage/$name.bin"

          sed -e "s/@NAME@/$name/g" \
              -e "s/@CHIP@/$chip/g" \
              -e "s/@TARGET@/${{ matrix.target }}/g" \
              packaging/FLA.in.txt > "$stage/FLA.txt"

          # --flash_mode, --flash_freq and --flash_size are deliberately left
          # out. merge_bin then takes them from the bootloader's own header, so
          # the merged image always matches how this target was built. These
          # differ per target: esp32 is 2 MB at 40 MHz, esp32s3 is 16 MB.
          esptool.py --chip "$chip" merge_bin \
            -o "$name.bin" \
            0x0     build/bootloader/bootloader.bin \
            0x8000  build/partition_table/partition-table.bin \
            0x10000 build/esp32-memtest.bin

          # Do not ship an image that will not boot. Refuse to release it.
          esptool.py image_info "$name.bin" | tee "$name.info"
          grep -qi "checksum.*valid" "$name.info" || {
            echo "::error::merged image for $name failed checksum validation"
            exit 1
          }
          grep -qi "Detected image type: ${{ matrix.imgtype }}" "$name.info" || {
            echo "::error::merged image for $name is not a ${{ matrix.imgtype }} image"
            grep -i "detected image type" "$name.info" || true
            exit 1
          }

          ( cd "$stage" && zip -q -r "../$name.zip" . )
          echo "built $name.bin and $name.zip"

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.name }}
          path: |
            ${{ matrix.name }}.zip
            ${{ matrix.name }}.bin

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artefacts

      - name: Collect artefacts
        run: |
          set -eu
          mkdir -p dist
          find artefacts -name '*.zip' -o -name '*.bin' | while read -r f; do
            cp "$f" dist/
          done
          ls -l dist
          # Every target must have produced exactly one zip and one merged image.
          n=$(ls dist | wc -l)
          [ "$n" -eq 8 ] || { echo "::error::expected 8 artefacts, found $n"; exit 1; }

      - name: Build release notes
        env:
          TAG: ${{ inputs.version }}
          REPO: ${{ github.repository }}
        run: |
          set -eu
          {
            echo "Prebuilt firmware for every supported target."
            echo
            echo "Each target ships as a zip with the three separate images and a"
            echo "\`FLA.txt\` describing the flash offsets, plus a single merged"
            echo "\`.bin\` image that can be flashed at offset \`0x0\`."
            echo
            echo "| Target | Merged image | Zip |"
            echo "| --- | --- | --- |"
            echo "| ESP32 | \`ESP32.bin\` | \`ESP32.zip\` |"
            echo "| ESP32S3 | \`ESP32S3.bin\` | \`ESP32S3.zip\` |"
            echo "| ESP32C3 | \`ESP32C3.bin\` | \`ESP32C3.zip\` |"
            echo "| ESP32P4 | \`ESP32P4.bin\` | \`ESP32P4.zip\` |"
            echo
            echo "Full instructions are in \`FLA.txt\` inside each zip, and in the"
            echo "[README](https://github.com/$REPO#prebuilt-images)."
            echo
            echo "See [CHANGELOG.md](https://github.com/$REPO/blob/$TAG/CHANGELOG.md) for what changed."
          } > notes.md
          cat notes.md

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          # Taken from the environment rather than interpolated with ${{ }}, so
          # the shell sees a plain string and a typo cannot become syntax.
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_PUBLISH: ${{ inputs.publish }}
        run: |
          set -eu

          tag="$INPUT_VERSION"
          case "$tag" in
            v[0-9]*) ;;
            *) echo "::error::the tag must look like v1.0.0, got '$tag'"; exit 1 ;;
          esac

          # Only an explicit "true" publishes. An empty value means the input was
          # never set, so the release stays a draft; anything else is a mistake
          # worth failing on rather than quietly guessing at.
          args="--draft"
          case "$INPUT_PUBLISH" in
            "")    ;;                            # unset: keep it a draft
            true)  args="--draft=false" ;;
            false) ;;                            # explicit draft
            *) echo "::error::publish must be true or false, got '$INPUT_PUBLISH'"; exit 1 ;;
          esac

          gh release create "$tag" dist/*.bin dist/*.zip --title "$tag" \
            --notes-file notes.md $args