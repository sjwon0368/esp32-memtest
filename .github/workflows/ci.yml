name: host tests

# The engine, the screen layout and the ANSI replay harness are plain C11 and
# build in a few seconds, so they run on every push. The firmware builds need a
# full ESP-IDF toolchain each and live in firmware.yml, which is manual.
on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Engine, screen and ANSI replay tests
        run: make -C tests/host all
      - name: Engine tests under ASan/UBSan
        run: make -C tests/host asan