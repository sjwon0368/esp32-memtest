name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  host-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Engine, screen and ANSI replay tests
        run: make -C tests/host all
      - name: Engine tests under ASan/UBSan
        run: make -C tests/host asan

  firmware:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [esp32, esp32s3, esp32c3, esp32p4]
    steps:
      - uses: actions/checkout@v4
      - uses: espressif/idf@v5.5
        with:
          target: ${{ matrix.target }}
      - name: Build
        run: idf.py build